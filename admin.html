<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة المسؤول</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="admin">
    <main class="card narrow" id="adminLogin">
        <h1>لوحة المسؤول</h1>
        <label for="adminPass">كلمة مرور المسؤول</label>
        <input id="adminPass" type="password">
        <p id="adminMsg" class="msg" role="status"></p>
        <button class="btn primary" id="adminEnter" type="button">دخول</button>
        <a class="link" href="index.html">رجوع</a>
    </main>

    <div id="adminPanel" hidden>
        <header class="topbar">
            <strong>لوحة المسؤول</strong>
            <span>
        <button class="btn ghost" id="refreshBtn" type="button" style="margin:0">تحديث</button>
        <a class="link" href="questions.html">تعديل الأسئلة</a>
        <a class="link" href="index.html">صفحة الطلاب</a>
      </span>
        </header>
        <main class="wrap">
            <div id="stats" class="stats"></div>
            <div class="actions" style="justify-content:flex-start;margin-bottom:.5rem">
                <button class="btn ghost" id="exportStudents" type="button" style="margin:0">تصدير الطلاب (Excel)</button>
                <button class="btn ghost" id="exportResults" type="button" style="margin:0">تصدير النتائج (Excel)</button>
            </div>

            <h2 class="sec-title">طلبات إنشاء الحسابات</h2>
            <div id="pending"></div>

            <h2 class="sec-title">أسماء الامتحانات وأكوادها</h2>
            <div id="examSettings"></div>

            <h2 class="sec-title">تحليل الامتحان (الإجابات الصحيحة وأكتر الأسئلة غلطًا)</h2>
            <select id="examSelect"></select>
            <div id="examAnalysis" style="margin-top:1rem"></div>

            <h2 class="sec-title">الطلاب ونتائجهم</h2>
            <div id="students"></div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
