<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول | الكويز</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">
    <main class="card narrow">
        <h1>أهلاً بك في الكويز</h1>
        <p class="muted">اكتب رقم تليفونك وكلمة المرور للدخول.</p>
        <form id="loginForm" novalidate>
            <label for="phone">رقم التليفون</label>
            <input id="phone" type="tel" inputmode="numeric" placeholder="01xxxxxxxxx" autocomplete="username">
            <label for="password">كلمة المرور</label>
            <input id="password" type="password" autocomplete="current-password">
            <div id="nameRow" hidden>
                <label for="name">اسمك (أول مرة فقط)</label>
                <input id="name" type="text" placeholder="الاسم بالكامل">
            </div>
            <p id="msg" class="msg" role="status"></p>
            <button class="btn primary" type="submit">دخول</button>
        </form>
    </main>
    <script src="app.js"></script>
</body>

</html>
